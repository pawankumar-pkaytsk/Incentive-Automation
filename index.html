  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--sd-bg-app); }
    #root { min-height: 100vh; }
    button { font-family: var(--sd-font-sans); }
    input { font-family: var(--sd-font-sans); }
    ::selection { background: rgba(71,100,205,0.2); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--sd-lowlight-1); border-radius: 999px; border: 2px solid var(--sd-bg-app); }
    ::-webkit-scrollbar-thumb:hover { background: var(--sd-lowlight-2); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    /* Content is fully visible by default. Entrance animations only run once
       the document is visible (avoids both-fill elements freezing hidden in
       background/inactive tabs). */
    html:not(.motion-on) *,
    html:not(.motion-on) *::before,
    html:not(.motion-on) *::after { animation: none !important; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* Loading splash */
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: var(--sd-bg-app); z-index: 999; transition: opacity 300ms ease;
    }
    #boot .dot {
      width: 12px; height: 12px; border-radius: 999px; background: var(--sd-primary);
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 0.3; transform: scale(0.8);} 50% { opacity: 1; transform: scale(1);} }
    @keyframes sdspin { to { transform: rotate(360deg); } }
    .sd-spin { animation: sdspin 0.7s linear infinite; }
    @keyframes sddot { 0%,80%,100% { opacity: 0.25; transform: translateY(0);} 40% { opacity: 1; transform: translateY(-3px);} }
    .sd-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--sd-primary); display: inline-block; animation: sddot 1s ease-in-out infinite; }
  </style>
</head>

  <script>
    // Enable entrance animations only when the document is actually visible.
    (function () {
      function on() {
        if (document.visibilityState === 'visible' &&
            !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('motion-on');
        }
      }
      document.addEventListener('visibilitychange', on);
      window.addEventListener('load', on);
      on();
    })();
  </script>
